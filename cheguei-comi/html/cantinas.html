<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cantinas.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de cantinas</title>
</head>
<body>

<header class="header-custom">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center">

            <div class="d-flex align-items-center gap-3">
                <img src="../imagens/logo.png" alt="Logo" class="logo">
                <h1 class="m-0 text-white">Nossas cantinas</h1>
            </div>

            <button id="btnVoltar" class="btn btn-lg btn-padaria">
                ← VOLTAR
            </button>

        </div>
    </div>
</header>

<main class="container my-5">
    <div class="row g-4 justify-content-center">

        <!-- Cantina 1 — Cheguei Comi -->
        <div class="col-lg-3 col-md-5 col-sm-8">
            <div class="cantina-card text-center p-4">
                <img src="../imagens/logo.png" alt="Cheguei Comi" class="cantina-logo mb-3">
                <h3 class="cantina-titulo">Cantina bloco 2</h3>
                <p class="cantina-desc">Salgados, lanches e bebidas</p>
                <a href="cardapio.html?cantina=Cheguei+Comi" class="btn btn-padaria btn-lg w-100">
                    VER CARDÁPIO
                </a>
            </div>
        </div>

        <!-- 
            Para adicionar mais cantinas, copie o bloco col-lg-3 acima,
            e troque: imagem, nome, descrição e o ?cantina= na URL 
        -->

    </div>
</main>

<footer>
    <div class="container text-center">
        <p class="m-0">© 2025 Cheguei Comi</p>
    </div>
</footer>

<script src="../javascript/cantinas.js"></script>

</body>
</html>
