<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cardapio.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARDÁPIO</title>
</head>
<body>

<header class="header-custom">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center">

            <div class="d-flex align-items-center gap-3">
                <img src="../imagens/logo.png" alt="Logo" class="logo">
                <h1 class="m-0 text-white">
                    CARDÁPIO — <span id="nomeCantina"></span>
                </h1>
            </div>

            <div class="d-flex gap-3">
                <button id="btnMenu" class="btn btn-lg btn-padaria">
                    ← CANTINAS
                </button>
                <button class="btn btn-lg btn-padaria">
                    COMPRAR AGORA
                </button>
            </div>

        </div>
    </div>
</header>

<main class="container my-5">
    <div class="row g-4">

        <!-- Produto 1 -->
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="card produto-card h-100">
                <div class="card-header produto-titulo">Coxinha de Frango</div>
                <img src="../imagens/coxinha.jpg" alt="Coxinha de Frango" class="produto-img">
                <div class="card-footer produto-preco">R$ 8,00</div>
            </div>
        </div>

        <!-- Produto 2 -->
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="card produto-card h-100">
                <div class="card-header produto-titulo">Risoles de Presunto e Queijo</div>
                <img src="../imagens/risoles.jpg" alt="Risoles" class="produto-img">
                <div class="card-footer produto-preco">R$ 7,50</div>
            </div>
        </div>

        <!-- Produto 3 -->
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="card produto-card h-100">
                <div class="card-header produto-titulo">Empada de Frango</div>
                <img src="../imagens/empada.jpg" alt="Empada de Frango" class="produto-img">
                <div class="card-footer produto-preco">R$ 9,00</div>
            </div>
        </div>

        <!-- Produto 4 -->
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="card produto-card h-100">
                <div class="card-header produto-titulo">Pão de Queijo</div>
                <img src="../imagens/paoqueijo.jpg" alt="Pão de Queijo" class="produto-img">
                <div class="card-footer produto-preco">R$ 5,00</div>
            </div>
        </div>

        <!-- Produto 5 -->
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="card produto-card h-100">
                <div class="card-header produto-titulo">Coca Cola</div>
                <img src="../imagens/coca.jpg" alt="Coca Cola" class="produto-img">
                <div class="card-footer produto-preco">R$ 8,00</div>
            </div>
        </div>

        <!-- Produto 6 -->
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="card produto-card h-100">
                <div class="card-header produto-titulo">Red Bull</div>
                <img src="../imagens/bull.jpg" alt="Red Bull" class="produto-img">
                <div class="card-footer produto-preco">R$ 8,00</div>
            </div>
        </div>

        <!-- Produto 7 -->
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="card produto-card h-100">
                <div class="card-header produto-titulo">Monster</div>
                <img src="../imagens/monster.jpg" alt="Monster" class="produto-img">
                <div class="card-footer produto-preco">R$ 8,00</div>
            </div>
        </div>

        <!-- Produto 8 -->
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="card produto-card h-100">
                <div class="card-header produto-titulo">Chá Mate Leão</div>
                <img src="../imagens/mate.jpg" alt="Chá Mate Leão" class="produto-img">
                <div class="card-footer produto-preco">R$ 8,00</div>
            </div>
        </div>

    </div>
</main>

<footer>
    <div class="container text-center">
        <p class="m-0">© 2025 Cheguei Comi</p>
    </div>
</footer>

<script src="../javascript/cardapio.js"></script>

</body>
</html>
